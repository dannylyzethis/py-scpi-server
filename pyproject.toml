[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scpi-instrument-emulator"
version = "2.4.0"
description = "A stateful SCPI instrument emulator for automation development and testing"
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md", "licenses/dependencies.json"]
authors = [
  { name = "Danny I" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
web = ["flask>=3.0", "flask-socketio>=5.3"]
discovery = ["zeroconf>=0.150"]
all = [
  "openpyxl>=3.1",
  "flask>=3.0",
  "flask-socketio>=5.3",
  "zeroconf>=0.150",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyvisa>=1.16",
  "pyvisa-py>=0.8",
  "zeroconf>=0.150",
  "ruff>=0.6",
]

[project.scripts]
scpi-emulator = "scpi_emulator.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scpi_emulator = ["profiles/*.json", "templates/*.html"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["scpi_emulator"]

[tool.coverage.report]
fail_under = 82
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
