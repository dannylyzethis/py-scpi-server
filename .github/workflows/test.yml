name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -ra

      - name: Run lint
        run: ruff check src tests tools

      - name: Smoke-test documented CLI
        run: |
          scpi-emulator --help
          scpi-emulator --version
          scpi-emulator --load scpi_instruments_example.csv
          scpi-emulator --bench examples/virtual-bench.json
          cd "$RUNNER_TEMP"
          scpi-emulator --create-example
          test -s scpi_instruments_example.csv
