name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[all,dev]"
      - run: python tools/verify.py test

  quality:
    name: Linux / Python 3.14 / quality and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[all,dev]"
      - run: python tools/verify.py quality

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scpi-emulator:ci .
      - run: docker run -d --rm --name scpi-emulator-ci -p 5555:5555 scpi-emulator:ci
      - name: Query the container over raw SCPI
        run: |
          python - <<'PY'
          import socket
          import time

          deadline = time.monotonic() + 15
          while True:
              try:
                  with socket.create_connection(("127.0.0.1", 5555), timeout=1) as client:
                      client.sendall(b"*IDN?\n")
                      response = client.recv(4096).decode().strip()
                      assert response.startswith(
                          "SCPI_Emulator,Virtual DMM CSV Example,"
                      )
                      break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(0.25)
          PY
      - if: always()
        run: docker logs scpi-emulator-ci || true
      - if: always()
        run: docker stop scpi-emulator-ci || true
